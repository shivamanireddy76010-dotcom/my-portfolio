<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Shiva</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:20px}
.box{max-width:600px;margin:auto;background:#1e293b;padding:25px;border-radius:12px}
input,textarea{width:100%;padding:12px;margin:8px 0;background:#0f172a;border:1px solid #334155;color:white;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#22c55e;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#16a34a}
.hidden{display:none}
#loginBox{text-align:center;margin-top:100px}
</style>
</head>
<body>

<div id="loginBox" class="box">
<h2>Admin Login</h2>
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="login()">Login</button>
<p id="err" style="color:#ef4444;margin-top:10px"></p>
</div>

<div id="adminBox" class="box hidden">
<h3>+ Add New Project</h3>
<input type="text" id="title" placeholder="Project Title - ex: E-commerce Website">
<textarea id="desc" rows="3" placeholder="Description"></textarea>
<input type="text" id="github" placeholder="GitHub Link - https://github.com/...">
<input type="text" id="image" placeholder="Image URL - https://... (leave empty if none)">

<button onclick="addProject()" style="background:#22c55e">+ Add Project</button>

<div id="projectList" style="margin-top:20px"></div>

<button onclick="saveData()" style="background:#22c55e;margin-top:20px">💾 SAVE & Download data.json</button>
<button onclick="logout()" style="background:#475569">Logout</button>

<p style="font-size:12px;color:#64748b;margin-top:15px;text-align:center">
After saving, data.json will be downloaded.<br>Upload it to GitHub and tell me - I will connect it to the main site.
</p>
</div>

<script>
const MY_PASS = "shiv@9912"; // Your secure password
let data = JSON.parse(localStorage.getItem('shivaPortfolio')) || {
  about: "I am Shiva Mani, Full Stack Developer",
  resume: "resume.pdf",
  projects: []
};

function login(){
  if(document.getElementById('pass').value === MY_PASS){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminBox').classList.remove('hidden');
    loadData();
  } else {
    document.getElementById('err').innerText = "Wrong password!";
  }
}

function logout(){
  document.getElementById('adminBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
  document.getElementById('pass').value="";
}

function loadData(){
  let list = document.getElementById('projectList');
  list.innerHTML = "";
  data.projects.forEach((p,i)=>{
    list.innerHTML += `<div style="background:#0f172a;padding:10px;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between">
    <span>${p.title}</span>
    <button onclick="deleteProject(${i})" style="width:auto;padding:5px 10px;background:#ef4444">Delete</button>
    </div>`;
  });
}

function addProject(){
  let t = document.getElementById('title').value;
  let d = document.getElementById('desc').value;
  let g = document.getElementById('github').value;
  let img = document.getElementById('image').value;
  if(!t){alert("Enter Title");return}
  data.projects.push({title:t, description:d, github:g, image:img});
  localStorage.setItem('shivaPortfolio', JSON.stringify(data));
  document.getElementById('title').value="";document.getElementById('desc').value="";document.getElementById('github').value="";document.getElementById('image').value="";
  loadData();
}

function deleteProject(i){
  data.projects.splice(i,1);
  localStorage.setItem('shivaPortfolio', JSON.stringify(data));
  loadData();
}

function saveData(){
  let blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "data.json";
  a.click();
}
</script>
</body>
</html>
